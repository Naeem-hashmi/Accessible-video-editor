name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  core-linux:
    name: Core tests (Linux, system FFmpeg)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      WHISPER_VERSION: b4938
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install FFmpeg, and Vulkan with Mesa's software device (to test the graphics-chip path)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libvulkan-dev glslc mesa-vulkan-drivers

      - name: Build whisper.cpp with Vulkan and loadable processor backends (as shipped on Windows)
        run: |
          git clone --depth 1 --branch "$WHISPER_VERSION" https://github.com/ggml-org/whisper.cpp "$RUNNER_TEMP/whisper.cpp"
          cmake -S "$RUNNER_TEMP/whisper.cpp" -B "$RUNNER_TEMP/whisper.cpp/build" -DCMAKE_BUILD_TYPE=Release -DWHISPER_BUILD_TESTS=OFF \
            -DGGML_VULKAN=ON -DGGML_BACKEND_DL=ON -DGGML_CPU_ALL_VARIANTS=ON -DGGML_NATIVE=OFF -DBUILD_SHARED_LIBS=ON
          cmake --build "$RUNNER_TEMP/whisper.cpp/build" -j 4 --target whisper-cli ggml-vulkan
          BIN="$RUNNER_TEMP/whisper.cpp/build/bin"
          echo "WHISPER_CLI=$BIN/whisper-cli" >> "$GITHUB_ENV"
          echo "AVE_VULKAN_CLI=$BIN/whisper-cli" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$BIN" >> "$GITHUB_ENV"

      - name: Cache speech models and voices
        uses: actions/cache@v4
        with:
          path: ~/speech-cache
          key: speech-models-base-turbo-q5-silero-piper-en-hi-ur-2

      - name: Download speech models and make test speech
        run: |
          mkdir -p ~/speech-cache/models ~/speech-cache/voices ~/speech
          cd ~/speech-cache/models
          for m in ggml-base.bin ggml-large-v3-turbo-q5_0.bin; do
            [ -s "$m" ] || curl -sSL --retry 3 -o "$m" "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/$m"
          done
          [ -s ggml-silero-v5.1.2.bin ] || curl -sSL --retry 3 -o ggml-silero-v5.1.2.bin "https://huggingface.co/ggml-org/whisper-vad/resolve/main/ggml-silero-v5.1.2.bin"
          echo "WHISPER_VAD_MODEL=$HOME/speech-cache/models/ggml-silero-v5.1.2.bin" >> "$GITHUB_ENV"
          ls -la
          # Real speech for the tests from Piper, an offline neural voice (en, hi, ur).
          python3 -m venv ~/piper && ~/piper/bin/pip install -q piper-tts
          cd ~/speech-cache/voices
          for v in en/en_US/lessac/medium/en_US-lessac-medium hi/hi_IN/pratham/medium/hi_IN-pratham-medium ur/ur_PK/fasih/medium/ur_PK-fasih-medium; do
            n=$(basename $v)
            for ext in onnx onnx.json; do
              [ -s "$n.$ext" ] || curl -sSL --retry 3 -o "$n.$ext" "https://huggingface.co/rhasspy/piper-voices/resolve/main/$v.$ext"
            done
          done
          echo "Hello and welcome to my channel. Today I will show you how to cook rice. First, wash the rice in cold water." | ~/piper/bin/piper -m en_US-lessac-medium.onnx --sentence-silence 1.2 -f ~/speech/english.wav
          echo "नमस्ते, मेरे चैनल में आपका स्वागत है। आज हम चावल बनाना सीखेंगे।" | ~/piper/bin/piper -m hi_IN-pratham-medium.onnx --sentence-silence 0.8 -f ~/speech/hindi.wav
          echo "السلام علیکم، میرے چینل میں خوش آمدید۔ آج ہم چاول بنانا سیکھیں گے۔" | ~/piper/bin/piper -m ur_PK-fasih-medium.onnx --sentence-silence 0.8 -f ~/speech/urdu.wav
          ls -la ~/speech
          echo "WHISPER_MODELS=$HOME/speech-cache/models" >> "$GITHUB_ENV"
          echo "AVE_SPEECH=$HOME/speech" >> "$GITHUB_ENV"

      - name: Test
        env:
          AVE_REQUIRE_TEXT: "1"
          AVE_REQUIRE_WHISPER: "1"
        run: dotnet test tests/AccessibleVideoEditor.Core.Tests -c Release --logger "console;verbosity=normal"

  windows:
    name: Windows build, tests, self-test and installer
    runs-on: windows-latest
    permissions:
      contents: write
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download FFmpeg (stable GPL release, full build with text drawing)
        shell: pwsh
        run: |
          # The "full" release build includes libfreetype and HarfBuzz, needed to draw text (and to shape
          # scripts such as Urdu and Hindi). The "essentials" build does not draw text.
          $ok = $false
          try {
            Invoke-WebRequest "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-full.7z" -OutFile ffmpeg.7z -UseBasicParsing
            & 7z x ffmpeg.7z -offmpeg-download -y | Out-Null
            $ok = $LASTEXITCODE -eq 0
            Write-Host "Downloaded the gyan.dev full release build."
          } catch {
            Write-Host "gyan.dev full build not available: $_"
          }
          if (-not $ok) {
            # Fall back to the newest BtbN release-branch GPL build (never a nightly).
            $release = Invoke-RestMethod "https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/latest" -Headers @{ Authorization = "Bearer ${{ github.token }}" }
            $asset = $release.assets | Where-Object { $_.name -match '^ffmpeg-n\d+\.\d+-latest-win64-gpl-\d+\.\d+\.zip$' } | Sort-Object name -Descending | Select-Object -First 1
            if (-not $asset) { throw "No FFmpeg release build could be downloaded." }
            Invoke-WebRequest $asset.browser_download_url -OutFile ffmpeg.zip -UseBasicParsing
            Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-download
            Write-Host "Downloaded $($asset.name)"
          }
          $exe = Get-ChildItem ffmpeg-download -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          $root = $exe.Directory.Parent.FullName
          New-Item -ItemType Directory -Force build/ffmpeg | Out-Null
          Copy-Item (Join-Path $exe.DirectoryName "ffmpeg.exe"), (Join-Path $exe.DirectoryName "ffprobe.exe") build/ffmpeg
          foreach ($name in "LICENSE.txt", "LICENSE", "README.txt") {
            $file = Join-Path $root $name
            if (Test-Path $file) { Copy-Item $file "build/ffmpeg/FFMPEG-$name" }
          }
          & build/ffmpeg/ffmpeg.exe -hide_banner -version | Select-Object -First 1
          $filters = & build/ffmpeg/ffmpeg.exe -hide_banner -filters
          foreach ($needed in "drawtext", "xfade", "acrossfade", "afftdn", "loudnorm") {
            if (-not ($filters | Select-String -SimpleMatch " $needed ")) { throw "The FFmpeg build has no $needed filter." }
          }
          Write-Host "FFmpeg has drawtext, xfade, acrossfade, afftdn and loudnorm."
          "FFMPEG_PATH=$((Resolve-Path build/ffmpeg).Path)" >> $env:GITHUB_ENV

      - name: Core tests (Windows, bundled FFmpeg)
        env:
          AVE_REQUIRE_TEXT: "1"
        run: dotnet test tests/AccessibleVideoEditor.Core.Tests -c Release --logger "console;verbosity=normal"

      - name: Publish the app (self-contained, x64)
        run: dotnet publish src/AccessibleVideoEditor.App -c Release -o build/app

      - name: Add FFmpeg, sounds and documentation
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/app/ffmpeg | Out-Null
          Copy-Item build/ffmpeg/* build/app/ffmpeg
          dotnet run --project tools/AccessibleVideoEditor.AssetGenerator -c Release -- build/app
          New-Item -ItemType Directory -Force build/app/docs | Out-Null
          Copy-Item docs/*.html build/app/docs
          Copy-Item LICENSE build/app/LICENSE.txt

      - name: Cache the whisper.cpp build
        id: whisper-cache
        uses: actions/cache@v4
        with:
          path: whisper-build
          key: whisper-b4938-vulkan-1.4.321.1-win-x64-1

      - name: Install the Vulkan SDK (to build the graphics-chip backend)
        if: steps.whisper-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $version = "1.4.321.1"
          Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/$version/windows/vulkansdk-windows-X64-$version.exe" -OutFile "$env:RUNNER_TEMP\vulkan-sdk.exe" -UseBasicParsing
          & "$env:RUNNER_TEMP\vulkan-sdk.exe" --accept-licenses --default-answer --confirm-command install | Out-Host
          "VULKAN_SDK=C:\VulkanSDK\$version" >> $env:GITHUB_ENV
          "C:\VulkanSDK\$version\Bin" >> $env:GITHUB_PATH

      - name: Build whisper.cpp with Vulkan and loadable processor backends
        if: steps.whisper-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          git clone --depth 1 --branch b4938 https://github.com/ggml-org/whisper.cpp whisper-src
          cmake -S whisper-src -B whisper-src/build -A x64 -DWHISPER_BUILD_TESTS=OFF -DGGML_VULKAN=ON -DGGML_BACKEND_DL=ON `
            -DGGML_CPU_ALL_VARIANTS=ON -DGGML_NATIVE=OFF -DBUILD_SHARED_LIBS=ON
          if ($LASTEXITCODE -ne 0) { throw "cmake configure failed" }
          cmake --build whisper-src/build --config Release -j 4 --target whisper-cli ggml-vulkan
          if ($LASTEXITCODE -ne 0) { throw "whisper.cpp build failed" }
          New-Item -ItemType Directory -Force whisper-build | Out-Null
          Copy-Item whisper-src/build/bin/Release/* whisper-build
          Copy-Item whisper-src/LICENSE whisper-build/WHISPER-LICENSE.txt

      - name: Add whisper.cpp and the voice activity model to the app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/app/whisper | Out-Null
          Copy-Item whisper-build/* build/app/whisper
          Invoke-WebRequest "https://huggingface.co/ggml-org/whisper-vad/resolve/main/ggml-silero-v5.1.2.bin" -OutFile build/app/whisper/ggml-silero-v5.1.2.bin -UseBasicParsing
          if (-not (Test-Path build/app/whisper/ggml-vulkan.dll)) { throw "ggml-vulkan.dll was not built." }
          Get-ChildItem build/app/whisper | Select-Object Name, Length | Format-Table | Out-String | Write-Host
          & build/app/whisper/whisper-cli.exe -h 2>&1 | Select-Object -First 3

      - name: Speech model and a spoken sample for the self-test
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force speech-models | Out-Null
          Invoke-WebRequest "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin" -OutFile speech-models/ggml-base.bin -UseBasicParsing
          "AVE_WHISPER_MODELS=$((Resolve-Path speech-models).Path)" >> $env:GITHUB_ENV
          try {
            Add-Type -AssemblyName System.Speech
            $voice = New-Object System.Speech.Synthesis.SpeechSynthesizer
            $wav = Join-Path $pwd "selftest-speech.wav"
            $voice.SetOutputToWaveFile($wav)
            $voice.Speak("Hello and welcome. This video shows how to cook rice.")
            $name = $voice.Voice.Name
            $voice.Dispose()
            "AVE_SELFTEST_SPEECH=$wav" >> $env:GITHUB_ENV
            Write-Host "Made a speech sample with $name."
          } catch {
            Write-Host "No Windows voice on this machine: $_"
          }

      - name: Add NVDA controller client (optional, for direct NVDA speech)
        continue-on-error: true
        shell: pwsh
        run: |
          $version = "2024.4.2"
          Invoke-WebRequest "https://www.nvaccess.org/files/nvda/releases/$version/nvda_${version}_controllerClient.zip" -OutFile nvda.zip -UseBasicParsing
          Expand-Archive nvda.zip -DestinationPath nvda-client
          $dll = Get-ChildItem nvda-client -Recurse -Filter "nvdaControllerClient*.dll" | Where-Object { $_.FullName -match "x64" } | Select-Object -First 1
          if (-not $dll) { throw "x64 controller client not found in the download." }
          Copy-Item $dll.FullName build/app/nvdaControllerClient.dll
          Write-Host "Added $($dll.FullName)"

      - name: Self-test the real app on the Windows desktop
        shell: pwsh
        run: |
          $log = Join-Path $pwd "self-test.log"
          $p = Start-Process -FilePath build/app/ClipScribe.exe -ArgumentList "--self-test", "`"$log`"" -PassThru
          if (-not $p.WaitForExit(600000)) { $p.Kill(); throw "Self-test timed out." }
          if (Test-Path $log) { Get-Content $log } else { Write-Host "No self-test log was written." }
          $appLog = Join-Path $env:APPDATA "ClipScribe/log.txt"
          if (Test-Path $appLog) { Write-Host "--- application log ---"; Get-Content $appLog }
          if ($p.ExitCode -ne 0) { throw "Self-test failed with exit code $($p.ExitCode)." }

      - name: Build the installer
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $default = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $default)) { choco install innosetup -y --no-progress }
          }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DSourceDir=$((Resolve-Path build/app).Path)" "/DAppVersion=0.3.0" installer/AccessibleVideoEditor.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed." }

      - name: Make the portable zip
        shell: pwsh
        run: Compress-Archive -Path build/app/* -DestinationPath build/installer/ClipScribe-portable-0.3.0.zip

      - uses: actions/upload-artifact@v4
        with:
          name: AccessibleVideoEditor-windows
          path: build/installer/*
          if-no-files-found: error

      - name: Publish the installer as a downloadable release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.0
          target_commitish: ${{ github.sha }}
          name: ClipScribe 0.3.0 (test build)
          prerelease: true
          body: |
            Test build from commit ${{ github.sha }}.
            Download ClipScribe-Setup-0.3.0.exe to install, or the portable zip to run without installing.
            Windows may warn that the installer is from an unknown publisher because it is not code-signed: choose More info, then Run anyway.
          files: |
            build/installer/ClipScribe-Setup-0.3.0.exe
            build/installer/ClipScribe-portable-0.3.0.zip
          fail_on_unmatched_files: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: self-test-log
          path: self-test.log
          if-no-files-found: ignore
