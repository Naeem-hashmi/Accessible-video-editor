name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  core-linux:
    name: Core tests (Linux, system FFmpeg)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Test
        env:
          AVE_REQUIRE_TEXT: "1"
        run: dotnet test tests/AccessibleVideoEditor.Core.Tests -c Release --logger "console;verbosity=normal"

  windows:
    name: Windows build, tests, self-test and installer
    runs-on: windows-latest
    permissions:
      contents: write
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Download FFmpeg (stable GPL release, full build with text drawing)
        shell: pwsh
        run: |
          # The "full" release build includes libfreetype and HarfBuzz, needed to draw text (and to shape
          # scripts such as Urdu and Hindi). The "essentials" build does not draw text.
          $ok = $false
          try {
            Invoke-WebRequest "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-full.7z" -OutFile ffmpeg.7z -UseBasicParsing
            & 7z x ffmpeg.7z -offmpeg-download -y | Out-Null
            $ok = $LASTEXITCODE -eq 0
            Write-Host "Downloaded the gyan.dev full release build."
          } catch {
            Write-Host "gyan.dev full build not available: $_"
          }
          if (-not $ok) {
            # Fall back to the newest BtbN release-branch GPL build (never a nightly).
            $release = Invoke-RestMethod "https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/latest" -Headers @{ Authorization = "Bearer ${{ github.token }}" }
            $asset = $release.assets | Where-Object { $_.name -match '^ffmpeg-n\d+\.\d+-latest-win64-gpl-\d+\.\d+\.zip$' } | Sort-Object name -Descending | Select-Object -First 1
            if (-not $asset) { throw "No FFmpeg release build could be downloaded." }
            Invoke-WebRequest $asset.browser_download_url -OutFile ffmpeg.zip -UseBasicParsing
            Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-download
            Write-Host "Downloaded $($asset.name)"
          }
          $exe = Get-ChildItem ffmpeg-download -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          $root = $exe.Directory.Parent.FullName
          New-Item -ItemType Directory -Force build/ffmpeg | Out-Null
          Copy-Item (Join-Path $exe.DirectoryName "ffmpeg.exe"), (Join-Path $exe.DirectoryName "ffprobe.exe") build/ffmpeg
          foreach ($name in "LICENSE.txt", "LICENSE", "README.txt") {
            $file = Join-Path $root $name
            if (Test-Path $file) { Copy-Item $file "build/ffmpeg/FFMPEG-$name" }
          }
          & build/ffmpeg/ffmpeg.exe -hide_banner -version | Select-Object -First 1
          $filters = & build/ffmpeg/ffmpeg.exe -hide_banner -filters
          foreach ($needed in "drawtext", "xfade", "acrossfade", "afftdn", "loudnorm") {
            if (-not ($filters | Select-String -SimpleMatch " $needed ")) { throw "The FFmpeg build has no $needed filter." }
          }
          Write-Host "FFmpeg has drawtext, xfade, acrossfade, afftdn and loudnorm."
          "FFMPEG_PATH=$((Resolve-Path build/ffmpeg).Path)" >> $env:GITHUB_ENV

      - name: Core tests (Windows, bundled FFmpeg)
        env:
          AVE_REQUIRE_TEXT: "1"
        run: dotnet test tests/AccessibleVideoEditor.Core.Tests -c Release --logger "console;verbosity=normal"

      - name: Publish the app (self-contained, x64)
        run: dotnet publish src/AccessibleVideoEditor.App -c Release -o build/app

      - name: Add FFmpeg, sounds and documentation
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/app/ffmpeg | Out-Null
          Copy-Item build/ffmpeg/* build/app/ffmpeg
          dotnet run --project tools/AccessibleVideoEditor.AssetGenerator -c Release -- build/app
          New-Item -ItemType Directory -Force build/app/docs | Out-Null
          Copy-Item docs/*.html build/app/docs
          Copy-Item LICENSE build/app/LICENSE.txt

      - name: Add NVDA controller client (optional, for direct NVDA speech)
        continue-on-error: true
        shell: pwsh
        run: |
          $version = "2024.4.2"
          Invoke-WebRequest "https://www.nvaccess.org/files/nvda/releases/$version/nvda_${version}_controllerClient.zip" -OutFile nvda.zip -UseBasicParsing
          Expand-Archive nvda.zip -DestinationPath nvda-client
          $dll = Get-ChildItem nvda-client -Recurse -Filter "nvdaControllerClient*.dll" | Where-Object { $_.FullName -match "x64" } | Select-Object -First 1
          if (-not $dll) { throw "x64 controller client not found in the download." }
          Copy-Item $dll.FullName build/app/nvdaControllerClient.dll
          Write-Host "Added $($dll.FullName)"

      - name: Self-test the real app on the Windows desktop
        shell: pwsh
        run: |
          $log = Join-Path $pwd "self-test.log"
          $p = Start-Process -FilePath build/app/AccessibleVideoEditor.exe -ArgumentList "--self-test", "`"$log`"" -PassThru
          if (-not $p.WaitForExit(600000)) { $p.Kill(); throw "Self-test timed out." }
          if (Test-Path $log) { Get-Content $log } else { Write-Host "No self-test log was written." }
          $appLog = Join-Path $env:APPDATA "AccessibleVideoEditor/log.txt"
          if (Test-Path $appLog) { Write-Host "--- application log ---"; Get-Content $appLog }
          if ($p.ExitCode -ne 0) { throw "Self-test failed with exit code $($p.ExitCode)." }

      - name: Build the installer
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $default = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $default)) { choco install innosetup -y --no-progress }
          }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DSourceDir=$((Resolve-Path build/app).Path)" "/DAppVersion=0.2.1" installer/AccessibleVideoEditor.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed." }

      - name: Make the portable zip
        shell: pwsh
        run: Compress-Archive -Path build/app/* -DestinationPath build/installer/AccessibleVideoEditor-portable-0.2.1.zip

      - uses: actions/upload-artifact@v4
        with:
          name: AccessibleVideoEditor-windows
          path: build/installer/*
          if-no-files-found: error

      - name: Publish the installer as a downloadable release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.1
          target_commitish: ${{ github.sha }}
          name: Accessible Video Editor 0.2.1 (test build)
          prerelease: true
          body: |
            Test build from commit ${{ github.sha }}.
            Download AccessibleVideoEditor-Setup-0.2.1.exe to install, or the portable zip to run without installing.
            Windows may warn that the installer is from an unknown publisher because it is not code-signed: choose More info, then Run anyway.
          files: |
            build/installer/AccessibleVideoEditor-Setup-0.2.1.exe
            build/installer/AccessibleVideoEditor-portable-0.2.1.zip
          fail_on_unmatched_files: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: self-test-log
          path: self-test.log
          if-no-files-found: ignore
